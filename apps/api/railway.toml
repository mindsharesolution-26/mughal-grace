[build]
builder = "nixpacks"
buildCommand = "pnpm install && pnpm --filter @mughal-grace/api build && pnpm --filter @mughal-grace/api db:migrate:deploy"

[deploy]
startCommand = "pnpm --filter @mughal-grace/api start"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
